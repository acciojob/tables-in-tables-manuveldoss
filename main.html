
<!DOCTYPE html>
<html>
<head>
    <title>Nested HTML Tables</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <table class="main-table">
        <tr>
            <!-- Nested Table 2 -->
            <td class="top-cell">
                <table>
                    <tr>
                        <th colspan="2">Nested Table 2</th>
                    </tr>
                    <tr>
                        <th>Column 1</th>
                        <th>Column 2</th>
                    </tr>
                    <tr>
                        <td>abc</td>
                        <td>def</td>
                    </tr>
                </table>
            </td>

            <!-- Nested Table 1 -->
            <td class="top-cell">
                <table>
                    <tr>
                        <th>Nested Table 1</th>
                    </tr>
                    <tr>
                        <td>
                            <ul>
                                <li>List item 1</li>
                                <li>List item 2</li>
                                <li>List item 3</li>
                            </ul>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr>
            <!-- Nested Table 3 -->
            <td class="bottom-cell">
                <table>
                    <tr>
                        <th colspan="2">Nested Table 3</th>
                    </tr>
                    <tr>
                        <td>
                            <a href="#">Nested Table</a>
                        </td>
                        <td>Demo Continued</td>
                    </tr>
                </table>
            </td>

            <!-- Nested Table 4 -->
            <td class="bottom-cell">
                <table>
                    <tr>
                        <th>Nested Table 4</th>
                    </tr>
                    <tr>
                        <td class="html-cell">HTML</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>
</html>
